<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo title=false %}
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }} · {{ site.title_zh }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ site.logo | relative_url }}">
  <link rel="alternate icon" href="{{ '/images/favicon.ico' | relative_url }}">
  <meta name="theme-color" content="#ffffff">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    {% include nav.html %}
    <div class="main">
      <header class="masthead">
        <a class="masthead-title" href="{{ '/' | relative_url }}"><span class="accent">CWan</span> Lab<span class="zh">{{ site.title_zh }}</span></a>
        <span class="masthead-tag">{{ site.tagline_short }}</span>
        <a class="masthead-logo" href="{{ '/' | relative_url }}" aria-hidden="true" tabindex="-1">{% include logo-cw.svg %}</a>
      </header>
      <main id="main">
        {{ content }}
      </main>
      {% include footer.html %}
    </div>
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
