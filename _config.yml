# ---------------------------------------------------------------------------
# CWan Lab website
#
# Sandbox copy: served from https://tuner12.github.io/cwanlab.github.io/
# To move this design back to the lab's own repo (cwanlab/cwanlab.github.io),
# change only the two lines below to:
#   url:     "https://cwanlab.github.io"
#   baseurl: ""
# ---------------------------------------------------------------------------
url: "https://tuner12.github.io"
baseurl: "/cwanlab.github.io"

title: "CWan Lab"
title_zh: "常万实验室"
tagline: "Artificial Intelligence, Machine Learning, and Spatial Biology in Precision Medicine"
tagline_short: "AI + Spatial Biology + Precision Medicine"
description: "CWan Lab develops AI/ML methods for spatial biology and precision oncology at the University of Chicago."
lang: en
logo: /images/logo-cw.svg   # dot-grid "cw" mark; original monogram kept at images/site-logo.png

affiliation: "Institute for Population and Precision Health · University of Chicago"

pi:
  name: "Guihong C. Wan, PhD"
  title: "Assistant Professor in Precision Health"
  note: "NIH/NCI K99/R00 Awardee"
  employer: "University of Chicago"
  email: "guihong.wan@outlook.com"
  photo: /images/profile.png
  scholar: "https://scholar.google.com/citations?user=lBar8UkAAAAJ&hl=en"
  github: "cwanlab"

# Top navigation. `url` is relative to the site root.
nav:
  - title: Research
    url: /publications/
  - title: News
    url: /news/
  - title: Talks & Teaching
    url: /talks/
  - title: Funding
    url: /funding/
  - title: People
    url: /group/
  - title: About PI
    url: /cv/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope: { path: "" }
    values: { layout: page }

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - .DS_Store
