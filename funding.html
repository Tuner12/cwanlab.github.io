---
title: Funding
permalink: /funding/
---
<ol class="funding">
  {% for f in site.data.funding %}
  <li>
    <p class="fund-meta"><span class="caps">{{ f.sponsor }}</span>{% if f.active %}<span class="status">Active</span>{% endif %}</p>
    <h3>{{ f.award }}</h3>
    <p>{{ f.project }}</p>
    <p class="muted"><em>{{ f.role }}: Guihong Wan · {{ f.period }}</em></p>
  </li>
  {% endfor %}
</ol>
