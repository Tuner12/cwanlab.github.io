<aside class="sidebar">
  <a class="side-logo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }} home">
    {% include logo-cw.svg %}
  </a>
  <nav class="nav" aria-label="Main">
    {% for item in site.nav %}
      {% assign active = false %}
      {% if page.url == item.url %}{% assign active = true %}{% endif %}
      <a href="{{ item.url | relative_url }}"{% if active %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {% endfor %}
  </nav>
  <div class="side-foot">
    <span>University of Chicago</span>
    <span>Precision Health</span>
  </div>
</aside>
